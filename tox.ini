[tox]
envlist = py39,py310,py311,py312,py313,static_analysis,coverage

[testenv]
deps = pytest
       parameterized
commands = pytest

[testenv:static_analysis]
deps = flake8
commands = flake8

[testenv:coverage]
deps = pytest
       coverage
       parameterized
commands = coverage run --source pwdhash -m pytest
           coverage report

[tox:travis]
3.9 = py39
3.10 = py310
3.11 = py311
3.12 = py312, static_analysis
3.13 = py313, coverage
