[project]
name = "pwdhash-cli"
version = "1.0.0.dev0"
description = "Stanford PwdHash password generator: command line tool and Python library"
authors = [{ name = "Wiktor Matuszewski", email = "pywkm@wukaem.pl" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["pwdhash", "password", "hash"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
clipboard = ["pyperclip"]

[project.urls]
Homepage = "https://github.com/pywkm/pwdhash"
Source = "https://github.com/pywkm/pwdhash"
Issues = "https://github.com/pywkm/pwdhash/issues"
Changelog = "https://github.com/pywkm/pwdhash/blob/master/CHANGELOG.md"

[project.scripts]
pwdhash = "pwdhash.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pyperclip",
    "types-pyperclip>=1.11.0.20260508",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pwdhash"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--cov=pwdhash", "--cov-report=term-missing"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["pwdhash"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]
